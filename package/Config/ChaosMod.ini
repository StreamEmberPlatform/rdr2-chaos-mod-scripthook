; StreamEmber Chaos Mod (RDR2) - <game>\StreamEmber\Config\ChaosMod.ini (kept on updates)
; Lines starting with ';' are ignored. Changes apply after reloading the scripts or restarting the game.

; Chaos page shown in the StreamEmber Overlay. Empty = the page published with this version
; (https://streamemberplatform.github.io/rdr2-chaos-mod-scripthook/). For UI work: UiUrl=http://127.0.0.1:5173/
UiUrl=

; Open / close the chaos menu (https://learn.microsoft.com/dotnet/api/system.windows.forms.keys).
; F7 / F8 are the overlay's own hotkeys, F5 is the trainer's.
MenuKey=F9

; MHud theme of the page: frontier, oldwest, modern, neon, tactical, minimal
Theme=frontier

; Automatic mode: a random effect every AutoInterval seconds (10..600). Can also be switched in the menu.
AutoMode=0
AutoInterval=45

; Experimental effects (honor): they write script globals found for game builds 1.0.1311 / 1.0.1436.
; Not verified on the current build; leave 0 unless you are testing them.
Experimental=0
